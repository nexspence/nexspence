name: Announce Release

# A release announces itself: the announcement is generated from the commits of
# the release, rendered, and published to the Telegram channel by the
# announcements repository's own workflow.
#
# The announcement used to be prepared by hand and committed to the private
# announcements repository — a step nobody remembers, which is why two
# releases (v2.13.3 and v2.13.4) shipped without an announcement at all. This
# workflow is that step.
#
# It is called by the Release workflow once the release is out, and it refuses
# to announce a release that does not exist yet. It used to run on the tag
# push, which is ten minutes before the release is published: the channel
# carried an announcement for a release the reader could not open yet, and a
# release whose build failed was announced all the same.
on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to announce (e.g. v2.13.8).'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to announce (e.g. v2.13.8). The release must be published.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag: $TAG"

      - name: Check that the release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The announcement goes out when the release exists, so it is checked
          # here: a tag without a release behind it is not something to announce.
          if ! gh api "repos/nexspence/nexspence/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::release ${TAG} is not published — nothing to announce yet"
            exit 1
          fi
          echo "release ${TAG} is published"

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags: the previous one says where the release starts
          # The Release workflow names the tag; a manual run names it too.
          ref: ${{ inputs.tag || github.ref }}

      - name: Checkout the announcements repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nexspence/announcements
          path: announcements
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 1

      - name: Collect the commits of the release
        run: |
          set -euo pipefail
          # The commits since the previous release are what the release is.
          # The previous release is the tag the release was cut from — not the
          # newest tag in the repository: that one is the release itself when it
          # is the latest, and a LATER release when an older tag is announced.
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi
          echo "range: $RANGE"
          git log --format=%s "$RANGE" > announcements/subjects.txt
          echo "commits: $(wc -l < announcements/subjects.txt)"

      - name: Generate the post
        working-directory: announcements
        run: |
          set -euo pipefail
          # A post that is already there was prepared by hand: a written
          # announcement says more than a generated one, and this workflow
          # must not overwrite it.
          if [ -f "posts/$TAG/telegram.txt" ]; then
            echo "posts/$TAG is already prepared — leaving it alone"
            exit 0
          fi
          # A release of chores and documentation has nothing a reader cares
          # about, and so nothing to announce. The release is still a release:
          # the announcement is skipped, not failed.
          status=0
          node scripts/generate.mjs "$TAG" subjects.txt || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::nothing to announce in $TAG — the release goes out without an announcement"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          node scripts/render.mjs "posts/$TAG"

      - name: Publish the post
        working-directory: announcements
        run: |
          set -euo pipefail
          if [ ! -f "posts/$TAG/telegram.txt" ]; then
            echo "nothing to publish"
            exit 0
          fi
          git add "posts/$TAG"
          if git diff --cached --quiet; then
            echo "post already published"
            exit 0
          fi
          git config user.name "nexspence-release[bot]"
          git config user.email "release@nexspence.com"
          git commit -m "content: prepare $TAG release announcement"
          # The push is what triggers the announcements repository's workflow:
          # it posts to the channel and records the message id.
          git push origin HEAD:main
