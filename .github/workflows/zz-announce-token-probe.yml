name: Announce Token Probe

# TEMPORARY: checks that the token the announce workflow uses can write to the
# private announcements repository. Deleted right after the check.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the announcements repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nexspence/announcements
          path: announcements
          token: ${{ secrets.RELEASE_PAT }}

      - name: Probe the write access
        working-directory: announcements
        run: |
          set -euo pipefail
          git config user.name "nexspence-probe[bot]"
          git config user.email "probe@nexspence.com"
          echo "probe" > .announce-token-probe
          git add .announce-token-probe
          git commit -m "probe: check the announcements write access"
          git push origin HEAD:refs/heads/announce-token-probe
          echo "the token can write to the announcements repository"
