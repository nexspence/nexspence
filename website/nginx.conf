server {
    # Above 1024 so the server can run as the unprivileged nginx user.
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Custom error pages (application styling).
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /403.html { internal; }
    location = /404.html { internal; }
    location = /50x.html { internal; }

    # Build artifacts land in the image root via `COPY .` — never serve them.
    location ~ ^/(Dockerfile|nginx\.conf|\.dockerignore)$ {
        return 404;
    }

    # Static site: an unknown path is a 404, never a fallback to index.
    location / {
        try_files $uri $uri/ =404;
    }
}