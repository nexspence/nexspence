# JWT signing key, bootstrap admin and OIDC cookie key from a Secret you
# already have.
#
# helm install nexspence deploy/helm/nexspence \
#   -f values-examples/nginx.yaml \
#   -f values-examples/existing-secrets.yaml

config:
  jwtSecretExistingSecret: nexspence-secrets
  jwtSecretExistingSecretKey: jwt-secret
  adminExistingSecret: nexspence-secrets
  adminExistingSecretUsernameKey: admin-username
  adminExistingSecretPasswordKey: admin-password

oidc:
  cookieKeyExistingSecret: nexspence-secrets
  cookieKeyExistingSecretKey: oidc-cookie-key
